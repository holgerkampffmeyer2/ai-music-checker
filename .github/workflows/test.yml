name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install pytest pytest-cov ruff mypy

      - name: Lint
        run: ruff check ai_music_checker/

      - name: Type check
        run: mypy ai_music_checker --ignore-errors

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
