[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-music-checker"
version = "0.1.0"
description = "Forensic heuristic tool to estimate AI-generation likelihood of music files"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "holger", email = "holger@example.com"}]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ai-music-checker = "ai_music_checker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_music_checker*"]

[tool.setuptools.package-data]
ai_music_checker = ["data/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false